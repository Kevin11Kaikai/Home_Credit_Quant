tabm:
  total_seconds: 14400
  fit_seconds: 2700
  max_epochs: 100
  patience: 10
  batch_size: 256
  effective_batch_size: 256
  k: 32
  n_blocks: 3
  d_block: 256
  n_bins: 32
  d_embedding: 16
  weight_decay: 0.0003
  gradient_clip: 1.0
  compile: false
